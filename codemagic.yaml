workflows:
  ios-app-store:
    name: UNUTMA iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.47.0
      xcode: latest
      vars:
        # iOS versions are independent of the Android pubspec release.
        IOS_VERSION_NAME: "1.0.12"
        IOS_BUILD_NUMBER: "14"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.unutma.mobile
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Validate Dart and tests
        script: |
          dart format --output=none --set-exit-if-changed lib test pigeons tools
          flutter analyze
          flutter test
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: >-
          flutter build ipa --release
          --build-name="$IOS_VERSION_NAME"
          --build-number="$IOS_BUILD_NUMBER"
          --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - test/failures/**
