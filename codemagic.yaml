workflows:
  ios-app-store:
    name: UNUTMA iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.unutma.mobile
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Validate Dart and tests
        script: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
